<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f2c94c" />
    <title>رهط بوست · أخبار وخدمات رهط والنقب</title>
    <meta http-equiv="refresh" content="0; url=https://rahatpost.com/" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 38%, rgba(242, 201, 76, 0.28) 0%, #0f172a 75%);
        color: #f8fafc;
        font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .ring {
        width: 76px;
        height: 76px;
        border-radius: 24px;
        background: #f2c94c;
        color: #111827;
        display: grid;
        place-items: center;
        font-weight: 900;
        font-size: 22px;
        box-shadow: 0 12px 32px rgba(242, 201, 76, 0.35);
        animation: pulse 1.4s infinite ease-in-out;
      }
      h1 { margin-top: 16px; font-size: 22px; font-weight: 800; }
      p { margin-top: 6px; font-size: 13px; color: #94a3b8; font-weight: 600; }
      .bar {
        margin-top: 20px;
        width: 140px;
        height: 6px;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.14);
        overflow: hidden;
      }
      .bar > span {
        display: block;
        width: 60%;
        height: 100%;
        border-radius: 99px;
        background: #f2c94c;
        animation: slide 1s infinite ease-in-out;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.06); }
      }
      @keyframes slide {
        0% { transform: translateX(100%); }
        100% { transform: translateX(-120%); }
      }
    </style>
  </head>
  <body>
    <div class="ring">رهط</div>
    <h1>رهط بوست</h1>
    <p>جاري فتح التطبيق بأعلى سرعة وأمان…</p>
    <div class="bar"><span></span></div>
    <script>
      window.location.replace("https://rahatpost.com/");
    </script>
  </body>
</html>
