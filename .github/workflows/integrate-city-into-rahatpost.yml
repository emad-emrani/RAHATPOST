name: Integrate RahatPost City into Main Project

on:
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/integrate-city-into-rahatpost.yml"
      - "integrate-city-into-rahatpost.yml"
  workflow_dispatch:
    inputs:
      install_Action:
        description: 'اكتب install لتحديث مدينة رهط بوست بالأبيض والأصفر والشوارع'
        required: true
        default: 'install'
      username:
        description: 'اختياري: اسم المستخدم أو الرابط لإضافته فوراً للمدينة'
        required: false
      display_name:
        description: 'اختياري: الاسم الظاهر للمواطن'
        required: false
      platform:
        description: 'منصة التواصل (instagram, facebook, tiktok, x, app)'
        required: false
        default: 'instagram'
        type: choice
        options:
          - instagram
          - facebook
          - tiktok
          - x
          - app

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  integrate:
    if: "!contains(github.event.head_commit.message, '[skip-city]')"
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 سحب كود مشروع رهط بوست (Checkout)
        uses: actions/checkout@v4

      - name: 🟢 تجهيز بيئة Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 🏗️ تحديث ملفات مدينة رهط بوست (الأبيض والأصفر + الشوارع وإشارات المرور)
        env:
          CITY_COMP_B64: ""
          CITY_ROUTE_B64: ""
          CITY_SQL_B64: ""
        run: |
          node << 'EOF'
          const fs = require('fs');
          fs.mkdirSync('src/components', { recursive: true });
          fs.mkdirSync('src/routes', { recursive: true });
          fs.mkdirSync('src/pages', { recursive: true });
          fs.mkdirSync('supabase', { recursive: true });

          fs.writeFileSync('supabase/city_schema.sql', Buffer.from(process.env.CITY_SQL_B64 || '', 'base64').toString('utf8'), 'utf8');
          fs.writeFileSync('src/components/rahat-city-3d.tsx', Buffer.from(process.env.CITY_COMP_B64 || '', 'base64').toString('utf8'), 'utf8');
          fs.writeFileSync('src/routes/city.tsx', Buffer.from(process.env.CITY_ROUTE_B64 || '', 'base64').toString('utf8'), 'utf8');
          fs.writeFileSync('src/pages/CityPage.tsx', 'export { CityPage as default, CityPage, getNextSpiralCoordinate, RESERVED_CENTER_COORDS } from "@/components/rahat-city-3d";\n', 'utf8');
          console.log('✅ تم تحديث مدينة رهط بوست التفاعلية بنجاح!');
          EOF

      - name: 🚀 حفظ التغييرات ورفعها للمشروع (Commit & Push)
        run: |
          git config --global user.name "RahatPost City Bot"
          git config --global user.email "bot@rahatpost.com"
          git add -A
          git commit -m "✨ تحديث مدينة رهط بوست 3D بالأبيض والأصفر والشوارع وإشارات المرور [skip-city]" || echo "لا توجد تغييرات جديدة"
          git push
