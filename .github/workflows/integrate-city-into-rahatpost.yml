name: Integrate RahatPost City into Main Project

on:
  workflow_dispatch:
    inputs:
      install_Action:
        description: 'دمج ملفات مدينة رهط بوست (CityPage.tsx) تلقائياً في المستودع'
        required: false
        default: 'install'
      username:
        description: 'إضافة ساكن سريع (اختياري - مثال: @ahmed)'
        required: false
        default: ''
      display_name:
        description: 'الاسم الظاهر فوق البيت (اختياري)'
        required: false
        default: ''
      platform:
        description: 'المنصة (app, facebook, instagram, x, tiktok)'
        required: false
        default: 'app'

permissions:
  contents: write

jobs:
  integrate-city-feature:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RAHATPOST Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install 3D & Isometric Dependencies
        run: |
          npm install three @react-three/fiber @react-three/drei @types/three --save

      - name: Generate Single-File CityPage.tsx & Supabase SQL
        run: |
          mkdir -p src/pages
          mkdir -p supabase

          cat << 'EOF' > supabase/city_schema.sql
          CREATE TABLE IF NOT EXISTS city_residents (
            id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            resident_number INT UNIQUE NOT NULL,
            username TEXT UNIQUE NOT NULL,
            display_name TEXT NOT NULL,
            neighborhood TEXT DEFAULT 'وسط المدينة',
            tier TEXT DEFAULT 'founder',
            house_style TEXT DEFAULT 'modern',
            grid_x INT NOT NULL,
            grid_y INT NOT NULL,
            social_platform TEXT DEFAULT 'app',
            is_visible BOOLEAN DEFAULT true,
            created_at TIMESTAMPTZ DEFAULT NOW()
          );

          CREATE TABLE IF NOT EXISTS city_landmarks (
            id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            title TEXT NOT NULL,
            subtitle TEXT,
            landmark_type TEXT DEFAULT 'mosque',
            sponsor_url TEXT,
            badge_text TEXT,
            grid_x INT NOT NULL,
            grid_y INT NOT NULL,
            is_active BOOLEAN DEFAULT true,
            created_at TIMESTAMPTZ DEFAULT NOW()
          );

          CREATE TABLE IF NOT EXISTS city_settings (
            id INT PRIMARY KEY DEFAULT 1,
            last_update_text TEXT DEFAULT 'اليوم',
            next_update_text TEXT DEFAULT 'بعد يومين',
            default_view_mode TEXT DEFAULT '2.5D',
            max_founders INT DEFAULT 1000,
            announcement_text TEXT DEFAULT 'أهلاً بكم في مدينة رهط بوست التفاعلية! لكل متابع ومشترك بيت باسمه.'
          );

          INSERT INTO city_settings (id) VALUES (1) ON CONFLICT DO NOTHING;
          EOF

          cat << 'EOF' > src/pages/CityPage.tsx
          import React, { useState, useEffect, useMemo } from 'react';
          import { Canvas } from '@react-three/fiber';
          import { OrbitControls, Html, PerspectiveCamera, OrthographicCamera } from '@react-three/drei';
          import { createClient } from '@supabase/supabase-js';
          import { Search, Box, Map, Shield, Share2, Sparkles, X, ExternalLink, Plus, Users, Building2, Settings, Trash2, Eye, EyeOff, ArrowRight } from 'lucide-react';

          // --- 1. Supabase & Data Types ---
          const supabaseUrl = import.meta.env.VITE_SUPABASE_URL || '';
          const supabaseKey = import.meta.env.VITE_SUPABASE_ANON_KEY || '';
          const supabase = supabaseUrl && supabaseKey ? createClient(supabaseUrl, supabaseKey) : null;

          export interface GridCoord { x: number; y: number; }
          export const RESERVED_CENTER_COORDS: GridCoord[] = [
            { x: 0, y: 0 }, { x: 1, y: 0 }, { x: -1, y: 0 }, { x: 0, y: 1 }, { x: 0, y: -1 }
          ];

          export function getNextSpiralCoordinate(occupiedList: GridCoord[]): GridCoord {
            let x = 0, y = 0, dx = 0, dy = -1;
            for (let i = 0; i < 10000; i++) {
              const isOccupied = RESERVED_CENTER_COORDS.some(c => c.x === x && c.y === y) || occupiedList.some(c => c.x === x && c.y === y);
              if (!isOccupied) return { x, y };
              if (x === y || (x < 0 && x === -y) || (x > 0 && x === 1 - y)) {
                const temp = dx; dx = -dy; dy = temp;
              }
              x += dx; y += dy;
            }
            return { x: 2, y: 2 };
          }

          export interface Resident {
            id: number;
            resident_number: number;
            username: string;
            display_name: string;
            neighborhood: string;
            tier: 'founder' | 'pioneer' | 'resident' | 'vip';
            house_style: 'modern' | 'heritage_tent' | 'villa';
            grid_x: number;
            grid_y: number;
            social_platform: 'app' | 'facebook' | 'instagram' | 'x' | 'tiktok';
            is_visible: boolean;
            created_at: string;
          }

          export interface Landmark {
            id: number;
            title: string;
            subtitle: string;
            landmark_type: 'mosque' | 'sponsor_shop' | 'heritage_council';
            sponsor_url: string;
            badge_text: string;
            grid_x: number;
            grid_y: number;
            is_active: boolean;
          }

          export interface CitySettings {
            id: number;
            last_update_text: string;
            next_update_text: string;
            default_view_mode: '3D' | '2.5D';
            max_founders: number;
            announcement_text: string;
          }

          const INITIAL_LANDMARKS: Landmark[] = [
            { id: 1, title: 'مسجد التقوى المركزي', subtitle: 'قلب مدينة رهط بوست ونقطة التقاء الأهالي', landmark_type: 'mosque', sponsor_url: 'https://rahatpost.com', badge_text: 'معلم مركزي', grid_x: 0, grid_y: 0, is_active: true },
            { id: 2, title: 'مضافة النقب (الشق)', subtitle: 'مجلس الأصالة والقهوة العربية لأهل رهط والنقب', landmark_type: 'heritage_council', sponsor_url: 'https://rahatpost.com', badge_text: 'تراثنا', grid_x: -1, grid_y: 0, is_active: true },
            { id: 3, title: 'دكان الأسبوع (مساحة راعية)', subtitle: 'خصم 20% لزوار مدينة رهط بوست — اضغط للتواصل عبر واتساب', landmark_type: 'sponsor_shop', sponsor_url: 'https://wa.me/972500000000', badge_text: 'دكان الأسبوع ✨', grid_x: 1, grid_y: 0, is_active: true },
          ];

          const INITIAL_SETTINGS: CitySettings = {
            id: 1,
            last_update_text: 'اليوم',
            next_update_text: 'بعد يومين',
            default_view_mode: '2.5D',
            max_founders: 1000,
            announcement_text: 'أهلاً بكم في مدينة رهط بوست! لكل متابع ومشترك بيت باسمه في قلب المدينة.',
          };

          function generateInitialResidents(): Resident[] {
            const sample = [
              { u: 'rahatpost', d: 'رهط بوست الرسمي', style: 'villa', tier: 'vip', n: 'وسط المدينة', p: 'app' },
              { u: 'coemad', d: 'عماد أبو غيث', style: 'heritage_tent', tier: 'founder', n: 'حارة المؤسسين', p: 'app' },
              { u: 'ahmed_negev', d: 'أحمد الهزيل', style: 'modern', tier: 'founder', n: 'حارة النور', p: 'facebook' },
              { u: 'khaled_rahat', d: 'خالد القريناوي', style: 'villa', tier: 'founder', n: 'حارة السلام', p: 'instagram' },
              { u: 'omar_99', d: 'عمر الزيادنة', style: 'heritage_tent', tier: 'founder', n: 'مضارب النقب', p: 'x' },
            ];
            const occupied: GridCoord[] = [];
            return sample.map((item, idx) => {
              const coord = getNextSpiralCoordinate(occupied);
              occupied.push(coord);
              return {
                id: idx + 1,
                resident_number: idx + 1,
                username: item.u,
                display_name: item.d,
                neighborhood: item.n,
                tier: item.tier as Resident['tier'],
                house_style: item.style as Resident['house_style'],
                grid_x: coord.x,
                grid_y: coord.y,
                social_platform: item.p as Resident['social_platform'],
                is_visible: true,
                created_at: new Date().toISOString(),
              };
            });
          }

          const getSocialProfileUrl = (platform: string, username: string) => {
            const clean = username.replace('@', '').trim();
            switch (platform) {
              case 'facebook': return `https://facebook.com/${clean}`;
              case 'instagram': return `https://instagram.com/${clean}`;
              case 'x': return `https://x.com/${clean}`;
              case 'tiktok': return `https://tiktok.com/@${clean}`;
              default: return 'https://rahatpost.com';
            }
          };

          const TILE_SIZE = 3.2;

          // --- 2. Main Unified Page Component ---
          export default function CityPage() {
            const [residents, setResidents] = useState<Resident[]>(() => {
              const saved = localStorage.getItem('rp_city_residents');
              return saved ? JSON.parse(saved) : generateInitialResidents();
            });
            const [landmarks, setLandmarks] = useState<Landmark[]>(() => {
              const saved = localStorage.getItem('rp_city_landmarks');
              return saved ? JSON.parse(saved) : INITIAL_LANDMARKS;
            });
            const [settings, setSettings] = useState<CitySettings>(() => {
              const saved = localStorage.getItem('rp_city_settings');
              return saved ? JSON.parse(saved) : INITIAL_SETTINGS;
            });

            const [viewMode, setViewMode] = useState<'3D' | '2.5D'>(settings.default_view_mode);
            const [searchQuery, setSearchQuery] = useState('');
            const [notFoundAlert, setNotFoundAlert] = useState(false);
            const [selectedResident, setSelectedResident] = useState<Resident | null>(null);
            const [selectedLandmark, setSelectedLandmark] = useState<Landmark | null>(null);
            const [showAdmin, setShowAdmin] = useState(false);
            const [adminUnlocked, setAdminUnlocked] = useState(false);
            const [pinInput, setPinInput] = useState('');
            const [activeTab, setActiveTab] = useState<'residents' | 'bulk' | 'landmarks' | 'settings'>('residents');

            // Admin Form States
            const [username, setUsername] = useState('');
            const [displayName, setDisplayName] = useState('');
            const [neighborhood, setNeighborhood] = useState('وسط المدينة');
            const [houseStyle, setHouseStyle] = useState<Resident['house_style']>('modern');
            const [platform, setPlatform] = useState<Resident['social_platform']>('app');
            const [bulkText, setBulkText] = useState('');

            useEffect(() => { localStorage.setItem('rp_city_residents', JSON.stringify(residents)); }, [residents]);
            useEffect(() => { localStorage.setItem('rp_city_landmarks', JSON.stringify(landmarks)); }, [landmarks]);
            useEffect(() => { localStorage.setItem('rp_city_settings', JSON.stringify(settings)); }, [settings]);

            useEffect(() => {
              if (!supabase) return;
              (async () => {
                const { data: resData } = await supabase.from('city_residents').select('*').order('resident_number', { ascending: true });
                if (resData && resData.length > 0) setResidents(resData);
                const { data: landData } = await supabase.from('city_landmarks').select('*');
                if (landData && landData.length > 0) setLandmarks(landData);
              })();
            }, []);

            const emptyPlots = useMemo(() => {
              const plots: { x: number; y: number }[] = [];
              for (let x = -5; x <= 5; x++) {
                for (let y = -5; y <= 5; y++) {
                  const isRes = residents.some(r => r.grid_x === x && r.grid_y === y && r.is_visible);
                  const isLand = landmarks.some(l => l.grid_x === x && l.grid_y === y && l.is_active);
                  const isCenter = RESERVED_CENTER_COORDS.some(c => c.x === x && c.y === y);
                  if (!isRes && !isLand && !isCenter) plots.push({ x, y });
                }
              }
              return plots;
            }, [residents, landmarks]);

            const handleSearch = (e: React.FormEvent) => {
              e.preventDefault();
              const q = searchQuery.replace('@', '').trim().toLowerCase();
              if (!q) return;
              const found = residents.find(r => r.username.toLowerCase() === q || r.display_name.toLowerCase().includes(q) || String(r.resident_number) === q);
              if (found) { setSelectedResident(found); setNotFoundAlert(false); }
              else { setSelectedResident(null); setNotFoundAlert(true); }
            };

            const handleAddSingle = async (e: React.FormEvent) => {
              e.preventDefault();
              if (!username.trim()) return;
              const occupied = residents.map(r => ({ x: r.grid_x, y: r.grid_y }));
              const nextCoord = getNextSpiralCoordinate(occupied);
              const nextNum = residents.length > 0 ? Math.max(...residents.map(r => r.resident_number)) + 1 : 1;
              const cleanUser = username.replace('@', '').trim();
              const newItem: Omit<Resident, 'id' | 'created_at'> = {
                resident_number: nextNum,
                username: cleanUser,
                display_name: displayName.trim() || cleanUser,
                neighborhood,
                tier: 'founder',
                house_style: houseStyle,
                grid_x: nextCoord.x,
                grid_y: nextCoord.y,
                social_platform: platform,
                is_visible: true,
              };
              setResidents(prev => [...prev, { ...newItem, id: Date.now(), created_at: new Date().toISOString() }]);
              if (supabase) await supabase.from('city_residents').insert([newItem]);
              setUsername(''); setDisplayName('');
            };

            const handleBulkAdd = async (e: React.FormEvent) => {
              e.preventDefault();
              const lines = bulkText.split('
').map(l => l.trim()).filter(Boolean);
              if (!lines.length) return;
              const occupied = residents.map(r => ({ x: r.grid_x, y: r.grid_y }));
              let maxNum = residents.length > 0 ? Math.max(...residents.map(r => r.resident_number)) : 0;
              const list: Omit<Resident, 'id' | 'created_at'>[] = [];
              for (const line of lines) {
                const parts = line.split('|').map(p => p.trim());
                const cleanUser = parts[0].replace('@', '');
                const dName = parts[1] || cleanUser;
                const plat = (parts[2] as Resident['social_platform']) || platform;
                const coord = getNextSpiralCoordinate(occupied);
                occupied.push(coord);
                maxNum += 1;
                list.push({
                  resident_number: maxNum,
                  username: cleanUser,
                  display_name: dName,
                  neighborhood,
                  tier: 'founder',
                  house_style: houseStyle,
                  grid_x: coord.x,
                  grid_y: coord.y,
                  social_platform: plat,
                  is_visible: true,
                });
              }
              setResidents(prev => [...prev, ...list.map((it, i) => ({ ...it, id: Date.now() + i, created_at: new Date().toISOString() }))]);
              if (supabase) await supabase.from('city_residents').insert(list);
              setBulkText(''); setActiveTab('residents');
            };

            if (showAdmin) {
              const requiredPin = import.meta.env.VITE_ADMIN_PIN || '2026';
              if (!adminUnlocked) {
                return (
                  <div dir="rtl" className="min-h-screen bg-slate-950 text-white flex items-center justify-center p-4">
                    <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl w-full max-w-sm text-center space-y-4">
                      <Shield className="w-10 h-10 text-amber-400 mx-auto" />
                      <h2 className="text-xl font-bold">لوحة تحكم مدينة رهط بوست</h2>
                      <input type="password" value={pinInput} onChange={e => setPinInput(e.target.value)} placeholder="رمز الدخول (2026)" className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-center" />
                      <div className="flex gap-2">
                        <button onClick={() => { if (pinInput === requiredPin) setAdminUnlocked(true); }} className="flex-1 bg-amber-500 text-slate-950 font-bold py-2 rounded-xl">دخول</button>
                        <button onClick={() => setShowAdmin(false)} className="px-4 py-2 rounded-xl bg-slate-800">رجوع</button>
                      </div>
                    </div>
                  </div>
                );
              }

              return (
                <div dir="rtl" className="min-h-screen bg-slate-950 text-slate-100 p-4 md:p-8">
                  <div className="max-w-5xl mx-auto space-y-6">
                    <div className="flex items-center justify-between border-b border-slate-800 pb-4">
                      <h1 className="text-2xl font-extrabold text-amber-400">إدارة مدينة رهط بوست</h1>
                      <button onClick={() => setShowAdmin(false)} className="flex items-center gap-2 px-4 py-2 rounded-xl bg-slate-800 text-sm font-bold">
                        <ArrowRight className="w-4 h-4" /> العودة للخريطة
                      </button>
                    </div>

                    <div className="flex gap-2">
                      <button onClick={() => setActiveTab('residents')} className={`px-4 py-2 rounded-xl font-bold text-sm ${activeTab === 'residents' ? 'bg-amber-500 text-slate-950' : 'bg-slate-900'}`}>إدارة السكان ({residents.length})</button>
                      <button onClick={() => setActiveTab('bulk')} className={`px-4 py-2 rounded-xl font-bold text-sm ${activeTab === 'bulk' ? 'bg-amber-500 text-slate-950' : 'bg-slate-900'}`}>إضافة جماعية (Bulk)</button>
                    </div>

                    {activeTab === 'residents' && (
                      <div className="space-y-4">
                        <form onSubmit={handleAddSingle} className="bg-slate-900 p-4 rounded-2xl grid grid-cols-1 md:grid-cols-6 gap-2">
                          <input type="text" placeholder="@username" value={username} onChange={e => setUsername(e.target.value)} className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm" required />
                          <input type="text" placeholder="الاسم الظاهر" value={displayName} onChange={e => setDisplayName(e.target.value)} className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm" />
                          <select value={platform} onChange={e => setPlatform(e.target.value as Resident['social_platform'])} className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm">
                            <option value="app">تطبيق رهط بوست</option>
                            <option value="facebook">Facebook</option>
                            <option value="instagram">Instagram</option>
                            <option value="x">X.com</option>
                            <option value="tiktok">TikTok</option>
                          </select>
                          <select value={neighborhood} onChange={e => setNeighborhood(e.target.value)} className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm">
                            <option value="وسط المدينة">وسط المدينة</option>
                            <option value="حارة المؤسسين">حارة المؤسسين</option>
                            <option value="مضارب النقب">مضارب النقب</option>
                          </select>
                          <select value={houseStyle} onChange={e => setHouseStyle(e.target.value as Resident['house_style'])} className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm">
                            <option value="modern">بيت عصري</option>
                            <option value="villa">فيلا</option>
                            <option value="heritage_tent">بيت شعر (شق)</option>
                          </select>
                          <button type="submit" className="bg-amber-500 text-slate-950 font-bold rounded-xl px-4 py-2 text-sm">إضافة بيت</button>
                        </form>
                      </div>
                    )}

                    {activeTab === 'bulk' && (
                      <form onSubmit={handleBulkAdd} className="bg-slate-900 p-5 rounded-2xl space-y-3">
                        <p className="text-xs text-slate-400">ضع كل حساب في سطر بصيغة: <code>username | الاسم الظاهر | facebook/instagram/x/app</code></p>
                        <textarea rows={6} value={bulkText} onChange={e => setBulkText(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm font-mono" placeholder="@ahmed | أحمد الهزيل | facebook" required />
                        <button type="submit" className="bg-amber-500 text-slate-950 font-bold px-6 py-2.5 rounded-xl text-sm">بناء البيوت تلقائياً</button>
                      </form>
                    )}
                  </div>
                </div>
              );
            }

            return (
              <div dir="rtl" className="h-screen w-screen overflow-hidden flex flex-col bg-slate-950 text-slate-100 select-none">
                <header className="z-20 bg-slate-950/90 border-b border-slate-800 px-4 py-2.5 flex flex-wrap items-center justify-between gap-3">
                  <div className="flex items-center gap-2">
                    <div className="w-9 h-9 rounded-xl bg-amber-500 flex items-center justify-center text-slate-950 font-black">ر</div>
                    <h1 className="font-extrabold text-base md:text-lg">مدينة رهط بوست</h1>
                  </div>

                  <form onSubmit={handleSearch} className="flex items-center gap-1.5 flex-1 max-w-md">
                    <input type="text" value={searchQuery} onChange={e => setSearchQuery(e.target.value)} placeholder="ابحث عن بيتك (@username أو الاسم)..." className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 text-xs md:text-sm" />
                    <button type="submit" className="bg-amber-500 text-slate-950 font-bold px-3.5 py-1.5 rounded-xl text-xs">ابحث</button>
                  </form>

                  <div className="flex items-center gap-2">
                    <button onClick={() => setViewMode(viewMode === '2.5D' ? '3D' : '2.5D')} className="px-3 py-1.5 rounded-xl bg-amber-500 text-slate-950 font-bold text-xs">
                      {viewMode === '2.5D' ? '🧊 تبديل إلى 3D' : '🗺️ تبديل إلى 2.5D'}
                    </button>
                    <button onClick={() => setShowAdmin(true)} className="p-2 rounded-xl bg-slate-900 border border-slate-800"><Shield className="w-4 h-4" /></button>
                  </div>
                </header>

                <main className="flex-1 relative">
                  <Canvas shadows>
                    {viewMode === '3D' ? <PerspectiveCamera makeDefault position={[18, 16, 18]} fov={45} /> : <OrthographicCamera makeDefault position={[20, 20, 20]} zoom={24} near={-50} far={200} />}
                    <OrbitControls enableRotate={viewMode === '3D'} enablePan enableZoom target={selectedResident ? [selectedResident.grid_x * TILE_SIZE, 0, selectedResident.grid_y * TILE_SIZE] : [0, 0, 0]} />
                    <ambientLight intensity={0.85} />
                    <directionalLight position={[15, 25, 10]} intensity={1.4} />
                    <mesh rotation={[-Math.PI / 2, 0, 0]} position={[0, -0.1, 0]}><planeGeometry args={[120, 120]} /><meshStandardMaterial color="#1c1917" /></mesh>

                    {emptyPlots.map((p, i) => (
                      <mesh key={i} rotation={[-Math.PI / 2, 0, 0]} position={[p.x * TILE_SIZE, 0.01, p.y * TILE_SIZE]}>
                        <planeGeometry args={[2.5, 2.5]} /><meshStandardMaterial color="#292524" transparent opacity={0.5} />
                      </mesh>
                    ))}

                    {residents.filter(r => r.is_visible).map(res => (
                      <group key={res.id} position={[res.grid_x * TILE_SIZE, 0, res.grid_y * TILE_SIZE]} onClick={() => setSelectedResident(res)}>
                        <mesh position={[0, 0.65, 0]}><boxGeometry args={[1.6, 1.1, 1.6]} /><meshStandardMaterial color="#cbd5e1" /></mesh>
                        <Html position={[0, 2.1, 0]} center distanceFactor={20}>
                          <div className="cursor-pointer px-2 py-0.5 rounded bg-slate-900/90 text-white text-[11px] font-bold border border-slate-700 whitespace-nowrap">
                            <span className="text-amber-400 ml-1">#{res.resident_number}</span>{res.display_name}
                          </div>
                        </Html>
                      </group>
                    ))}
                  </Canvas>

                  {selectedResident && (
                    <div className="absolute bottom-8 left-1/2 -translate-x-1/2 z-30 bg-slate-900 border-2 border-amber-500 rounded-2xl p-5 w-[92%] max-w-md shadow-2xl">
                      <div className="flex justify-between items-start">
                        <div>
                          <h3 className="font-extrabold text-lg">#{selectedResident.resident_number} - {selectedResident.display_name}</h3>
                          <p className="text-xs text-slate-400">@{selectedResident.username} • {selectedResident.neighborhood} • ({selectedResident.social_platform})</p>
                        </div>
                        <button onClick={() => setSelectedResident(null)}><X className="w-5 h-5" /></button>
                      </div>
                      <div className="mt-4 flex gap-2">
                        <a href={getSocialProfileUrl(selectedResident.social_platform, selectedResident.username)} target="_blank" rel="noreferrer" className="flex-1 text-center bg-amber-500 text-slate-950 font-bold py-2 rounded-xl text-xs">
                          زيارة الحساب ({selectedResident.social_platform})
                        </a>
                      </div>
                    </div>
                  )}
                </main>
              </div>
            );
          }
          EOF

      - name: Commit & Push Integrated Files to Repository
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add package.json package-lock.json src/pages/CityPage.tsx supabase/city_schema.sql || true
          git diff --quiet && git diff --staged --quiet || git commit -m "feat: integrate RahatPost Interactive City (3D/2.5D + Admin + Social links) into main repo"
          git push
