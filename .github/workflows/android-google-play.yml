name: Build Signed Android AAB and APK for Google Play

# Builds a signed Android App Bundle and APK, then attaches them to the
# GitHub release v1.0.0. This workflow must never commit or push to any branch.
# A push back to main is what made the old unpack step loop.
#
# Required Actions secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64    base64 of the upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD  keystore store password
#   ANDROID_KEY_ALIAS          key alias inside the keystore
#   ANDROID_KEY_PASSWORD       key password
# Until those four secrets exist, this job stops before Gradle and publishes nothing.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-google-play
  cancel-in-progress: false

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare upload keystore from Actions secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${ANDROID_KEYSTORE_BASE64}" ] || missing+=("ANDROID_KEYSTORE_BASE64")
          [ -n "${ANDROID_KEYSTORE_PASSWORD}" ] || missing+=("ANDROID_KEYSTORE_PASSWORD")
          [ -n "${ANDROID_KEY_ALIAS}" ] || missing+=("ANDROID_KEY_ALIAS")
          [ -n "${ANDROID_KEY_PASSWORD}" ] || missing+=("ANDROID_KEY_PASSWORD")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing Android signing secrets: ${missing[*]}. Add them under Settings → Secrets and variables → Actions. This job does not keep a keystore in the repo."
            exit 1
          fi
          umask 077
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > /tmp/rahatpost-upload.jks; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64."
            exit 1
          fi
          if [ ! -s /tmp/rahatpost-upload.jks ]; then
            echo "::error::Decoded keystore is empty."
            exit 1
          fi
          python3 - << 'PY'
          import os
          from pathlib import Path
          path = Path("/tmp/keystore.properties")
          path.write_text(
              "storeFile=/tmp/rahatpost-upload.jks\n"
              f"storePassword={os.environ['ANDROID_KEYSTORE_PASSWORD']}\n"
              f"keyAlias={os.environ['ANDROID_KEY_ALIAS']}\n"
              f"keyPassword={os.environ['ANDROID_KEY_PASSWORD']}\n",
              encoding="utf-8",
          )
          path.chmod(0o600)
          PY
          echo "RAHATPOST_KEYSTORE_PROPERTIES=/tmp/keystore.properties" >> "$GITHUB_ENV"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install Capacitor and sync the Android project
        run: |
          cd mobile
          npm install
          npx cap sync android

      - name: Build signed Google Play bundle and APK
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/rahatpost-google-play.aab"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/rahatpost-release.apk"
          ls -lh "$GITHUB_WORKSPACE/rahatpost-google-play.aab" "$GITHUB_WORKSPACE/rahatpost-release.apk"

      - name: Publish download links on GitHub release v1.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0.0 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.0.0 \
            "$GITHUB_WORKSPACE/rahatpost-google-play.aab" \
            "$GITHUB_WORKSPACE/rahatpost-release.apk" \
            --title "تطبيق رهط بوست v1.0.0 — جاهز لمتجر Google Play (.aab & .apk)" \
            --notes "اضغط على ملف **rahatpost-google-play.aab** بالأسفل لتحميله ورفعه في Google Play Console، أو حمّل **rahatpost-release.apk** لتثبيت التطبيق مباشرة على الهاتف."
