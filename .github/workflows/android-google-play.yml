          PYEOF

          while IFS= read -r -d '' Z; do
            LOWER=$(echo "$Z" | tr '[:upper:]' '[:lower:]')
            if [[ "$LOWER" == *"routes"* ]]; then
              mkdir -p src/routes
              unzip -o "$Z" -d src/routes/
              rm -f "$Z"
            elif [[ "$LOWER" == *"mobile"* || "$LOWER" == *"admob"* || "$LOWER" == *"rahatpost"* ]]; then
              unzip -o "$Z" -d .
              rm -f "$Z"
            fi
          done < <(find . -maxdepth 3 -type f -iname "*.zip" -not -path "./.git/*" -print0)

          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Apply AdMob SDK and interactive Post Guide updates ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git pull --rebase origin main
            git push origin main || true
          fi

