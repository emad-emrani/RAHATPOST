            zAEEFO0VF9HYZAZkWL3aqLqtlwwUWHFHAgInEA==
          """
          with open("/tmp/rahatpost-upload.jks", "wb") as f:
              f.write(base64.b64decode(jks_b64))
          PYEOF
          cat > /tmp/keystore.properties << 'PROPS'
          storeFile=/tmp/rahatpost-upload.jks
          storePassword=RahatPost2026Store!
          keyAlias=upload
          keyPassword=RahatPost2026Store!
          PROPS
          echo "RAHATPOST_KEYSTORE_PROPERTIES=/tmp/keystore.properties" >> "$GITHUB_ENV"

      - name: Install Capacitor & Sync Android Project
        run: |
          cd mobile
          npm install
          npx cap sync android

      - name: Build Signed Google Play Bundle (.aab) and Signed APK (.apk)
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/rahatpost-google-play.aab"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/rahatpost-release.apk"
          ls -lh "$GITHUB_WORKSPACE/rahatpost-google-play.aab" "$GITHUB_WORKSPACE/rahatpost-release.apk"

      - name: Publish Direct Download Links to GitHub Releases (v1.0.0)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0.0 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.0.0             "$GITHUB_WORKSPACE/rahatpost-google-play.aab"             "$GITHUB_WORKSPACE/rahatpost-release.apk"             --title "تطبيق رهط بوست v1.0.0 — جاهز لمتجر Google Play (.aab & .apk)"             --notes "اضغط على ملف **rahatpost-google-play.aab** بالأسفل لتحميله مباشرة إلى جوالك (بدون ملف مضغوط ZIP) ورفعه في Google Play Console، أو حمّل **rahatpost-release.apk** لتثبيت التطبيق مباشرة على الهاتف."
