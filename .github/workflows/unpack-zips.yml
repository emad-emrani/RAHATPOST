                  tf.extractall(".")
              print("Applied Article/Video/Live Publisher, Pinning, 6-Style Directory & Splash updates!")

          if os.path.exists("index.tsx"):
              os.makedirs("src/routes", exist_ok=True)
              shutil.move("index.tsx", "src/routes/index.tsx")
              print("Moved root index.tsx -> src/routes/index.tsx")

          old_wf = ".github/workflows/apply-admob-sdk.yml"
          if os.path.exists(old_wf):
              try:
                  os.remove(old_wf)
                  print("Removed old .github/workflows/apply-admob-sdk.yml!")
              except Exception:
                  pass

          for wf_p in glob.glob(".github/workflows/*.yml"):
              if os.path.basename(wf_p) in ("unpack-zips.yml", "update-buses.yml", "update-directory.yml"):
                  continue
              try:
                  with open(wf_p, "r", encoding="utf-8") as f:
                      txt = f.read()
                  new_txt = re.sub(r"on:\s+push:\s+branches:\s+- main\s+workflow_dispatch:", "on:\n  workflow_dispatch:", txt)
                  new_txt = re.sub(r"- name: Unpack any uploaded ZIPs[\s\S]*?(?=- name: Setup Node\.js 20)", "", new_txt)
                  if "b64_data" in new_txt:
                      os.remove(wf_p)
                      print("Removed legacy b64_data workflow:", wf_p)
                  elif new_txt != txt:
                      with open(wf_p, "w", encoding="utf-8") as f:
                          f.write(new_txt)
              except Exception as e:
                  print("Workflow cleanup note:", e)

          try:
              from PIL import Image
              for p in sorted(set(["mobile/assets/splash.png", "mobile/assets/splash-dark.png"] + glob.glob("mobile/android/app/src/main/res/drawable*/splash.png"))):
                  if os.path.exists(p):
                      with Image.open(p) as im:
                          w, h = im.size
                      Image.new("RGB", (w, h), (241, 242, 244)).save(p, "PNG", optimize=True)
          except Exception as e:
              print("Splash cleanup note:", e)
          PYEOF

          while IFS= read -r -d '' Z; do
            LOWER=$(echo "$Z" | tr '[:upper:]' '[:lower:]')
            if [[ "$LOWER" == *"routes"* ]]; then
              mkdir -p src/routes
              unzip -o "$Z" -d src/routes/
              rm -f "$Z"
            elif [[ "$LOWER" == *"mobile"* || "$LOWER" == *"admob"* || "$LOWER" == *"rahatpost"* || "$LOWER" == *"update"* ]]; then
              unzip -o "$Z" -d .
              rm -f "$Z"
            fi
          done < <(find . -maxdepth 3 -type f -iname "*.zip" -not -path "./.git/*" -print0)

          rm -f .github/workflows/apply-admob-sdk.yml

      - name: Commit and push extracted files
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Article/Video/Live Publisher with Pinning + 6 Directory styles ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git pull --rebase origin main
          git push origin main
