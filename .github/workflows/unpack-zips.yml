            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            if ! git diff-index --quiet HEAD; then
              git commit -m "feat: add Arnona resident certificate, square icons, live bus map with nearest stop & all cumulative updates [skip-unpack]"
              git push origin HEAD:${{ github.ref }}
              echo "Successfully pushed unpacked updates to repository."
            else
              echo "No diff detected after applying updates."
            fi
          else
            echo "No changes required."
          fi
