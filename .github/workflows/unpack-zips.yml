name: Auto Unpack Uploaded ZIPs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unpack-zips
  cancel-in-progress: false

jobs:
  unpack:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack uploaded files and apply 6-Style Rahat Directory Hub, Store Control & Splash updates
