          if [ -s /tmp/rahatpost-embedded-update.zip ]; then
            echo "Unpacking embedded update into repository..."
            unzip -o -q /tmp/rahatpost-embedded-update.zip -d .
            CHANGED=1
          fi

          for zip_file in *.zip .github/workflows/*.zip; do
            if [ -f "$zip_file" ]; then
              echo "Unpacking $zip_file into repository..."
              unzip -o -q "$zip_file" -d .
              rm -f "$zip_file"
              CHANGED=1
            fi
          done

          if [ "$CHANGED" -eq 1 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            if ! git diff-index --quiet HEAD; then
              git commit -m "chore: apply Rahat Post AI Video Studio, trending strip & platform styling [skip-unpack]"
              git push origin HEAD:${{ github.ref }}
              echo "Successfully pushed unpacked updates to repository."
            else
              echo "No diff detected after applying updates."
            fi
          else
            echo "No changes required."
          fi
