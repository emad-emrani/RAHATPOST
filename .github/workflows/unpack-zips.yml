          PYEOF

          while IFS= read -r -d '' Z; do
            LOWER=$(echo "$Z" | tr '[:upper:]' '[:lower:]')
            if [[ "$LOWER" == *"routes"* ]]; then
              mkdir -p src/routes
              unzip -o "$Z" -d src/routes/
              rm -f "$Z"
            elif [[ "$LOWER" == *"mobile"* || "$LOWER" == *"admob"* || "$LOWER" == *"rahatpost"* ]]; then
              unzip -o "$Z" -d .
              rm -f "$Z"
            fi
          done < <(find . -maxdepth 3 -type f -iname "*.zip" -not -path "./.git/*" -print0)

      - name: Commit and push extracted files
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update Rahat Directory with Shop Logos, Member Supervision, Products & Offer Campaigns ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git pull --rebase origin main
          git push origin main
