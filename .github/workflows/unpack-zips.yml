          with tarfile.open(fileobj=io.BytesIO(raw), mode="r:gz") as tf:
              tf.extractall(".")
          print("Applied Top Weather Bar, Launch Splash, Status Bar & Directory Hub updates!")

          try:
              from PIL import Image, ImageDraw
              fg_img = Image.open("mobile/assets/icon-foreground.png").convert("RGBA")
              bbox = fg_img.getbbox()
              stamp_img = fg_img.crop(bbox) if bbox else fg_img
              def make_splash(w, h, dark=False):
                  bg = (17, 24, 39) if dark else (242, 201, 76)
                  canvas = Image.new("RGBA", (w, h), bg + (255,))
                  bsize = max(130, min(260, int(min(w, h) * 0.23)))
                  rad = int(bsize * 0.30)
                  hsize = int(bsize * 1.34)
                  halo = Image.new("RGBA", (w, h), (0, 0, 0, 0))
                  ImageDraw.Draw(halo).ellipse([(w-hsize)//2, (h-hsize)//2, (w+hsize)//2, (h+hsize)//2], fill=(255,255,255,45) if not dark else (242,201,76,40))
                  canvas = Image.alpha_composite(canvas, halo)
                  card = Image.new("RGBA", (w, h), (0, 0, 0, 0))
                  ImageDraw.Draw(card).rounded_rectangle([(w-bsize)//2, (h-bsize)//2, (w+bsize)//2, (h+bsize)//2], radius=rad, fill=(255,255,255,255), outline=(17,24,39,45), width=max(2, bsize//48))
                  canvas = Image.alpha_composite(canvas, card)
                  sw, sh = stamp_img.size
                  sc = min((bsize * 0.76) / sw, (bsize * 0.76) / sh)
                  nw, nh = max(1, int(sw * sc)), max(1, int(sh * sc))
                  rs = stamp_img.resize((nw, nh), Image.Resampling.LANCZOS)
                  canvas.paste(rs, ((w - nw) // 2, (h - nh) // 2), rs)
                  return canvas.convert("RGB")
              for p in sorted(set(["mobile/assets/splash.png", "mobile/assets/splash-dark.png"] + glob.glob("mobile/android/app/src/main/res/drawable*/splash.png") + glob.glob("public/splash/*.png"))):
                  if os.path.exists(p):
                      with Image.open(p) as im:
                          w, h = im.size
                      make_splash(w, h, dark=("night" in p or "dark" in p)).save(p, "PNG", optimize=True)
          except Exception as e:
              print("Splash regen note:", e)

          agp = ".github/workflows/android-google-play.yml"
          if os.path.exists(agp):
              with open(agp, "r", encoding="utf-8") as f:
                  txt = f.read()
              txt = re.sub(r"on:\s+push:\s+branches:\s+- main\s+workflow_dispatch:", "on:\n  workflow_dispatch:", txt)
              txt = re.sub(r"- name: Unpack any uploaded ZIPs[\s\S]*?(?=- name: Setup Node\.js 20)", "", txt)
              with open(agp, "w", encoding="utf-8") as f:
                  f.write(txt)
          PYEOF

          while IFS= read -r -d '' Z; do
            LOWER=$(echo "$Z" | tr '[:upper:]' '[:lower:]')
            if [[ "$LOWER" == *"routes"* ]]; then
              mkdir -p src/routes
              unzip -o "$Z" -d src/routes/
              rm -f "$Z"
            elif [[ "$LOWER" == *"mobile"* || "$LOWER" == *"admob"* || "$LOWER" == *"rahatpost"* ]]; then
              unzip -o "$Z" -d .
              rm -f "$Z"
            fi
          done < <(find . -maxdepth 3 -type f -iname "*.zip" -not -path "./.git/*" -print0)

      - name: Commit and push extracted files
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update Top Weather & Prayer Bar to single-row harmonious layout ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git pull --rebase origin main
          git push origin main
