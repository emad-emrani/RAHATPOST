          if [ -s /tmp/rahatpost-matches-fix.zip ]; then
            unzip -o -q /tmp/rahatpost-matches-fix.zip -d .
            CHANGED=1
          fi

          for zip_file in *.zip .github/workflows/*.zip; do
            if [ -f "$zip_file" ]; then
              echo "Unpacking $zip_file into repository..."
              unzip -o -q "$zip_file" -d .
              rm -f "$zip_file"
              CHANGED=1
            fi
          done

          if [ "$CHANGED" -eq 1 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            if ! git diff-index --quiet HEAD; then
              git commit -m "fix(matches): remove synthetic fallback matches and fetch real Ligat HaAl fixtures [skip-unpack]"
              git push origin HEAD:${{ github.ref }}
              echo "Successfully pushed real matches fix to repository."
            else
              echo "No diff detected after applying updates."
            fi
          else
            echo "No changes required."
          fi
