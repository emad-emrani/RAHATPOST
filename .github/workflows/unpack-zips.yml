name: Unpack Submitted Zip Updates

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip-unpack]')"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply embedded Rahat Post update, clean redundant files & unpack any zip archives
        run: |
          set -e
          CHANGED=0

          for old_path in \
            ".github/workflows/rahatpost-update.zip" \
            "src/routes/AdBanner.tsx" \
            "src/routes/DesktopLayout.tsx" \
            "src/components/matches.tsx" \
            "vercel.json" \
            "attachments" \
            "screenshots"; do
            if [ -e "$old_path" ]; then
              echo "Removing redundant path: $old_path"
              rm -rf "$old_path"
              CHANGED=1
            fi
          done

          echo "Applying embedded update package..."
          cat << 'EMBEDDED_ZIP_B64_EOF' | base64 -d > /tmp/rahatpost-embedded-update.zip
