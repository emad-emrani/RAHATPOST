name: Unpack Submitted Zip Updates

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  unpack:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip-unpack]')"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply real matches fix & unpack any zip archives
        run: |
          set -e
          CHANGED=0

          echo "Applying verified real matches update..."
          cat << 'EMBEDDED_ZIP_B64_EOF' | base64 -d > /tmp/rahatpost-matches-fix.zip
