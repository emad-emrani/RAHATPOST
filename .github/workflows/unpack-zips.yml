          B64_EOF
          unzip -o -q /tmp/embedded-update.zip -d .
          rm -f /tmp/embedded-update.zip

          shopt -s nullglob
          ZIPS=(*.zip updates/*.zip)
          for z in "${ZIPS[@]}"; do
            if [ "$z" = "rahatpost-app.zip" ]; then
              echo "Skipping full archive backup rahatpost-app.zip..."
              git rm -f "$z" 2>/dev/null || rm -f "$z"
              continue
            fi
            echo "Unpacking $z..."
            TMP_DIR=$(mktemp -d)
            unzip -o -q "$z" -d "$TMP_DIR"
            if [ -d "$TMP_DIR/src" ] || [ -f "$TMP_DIR/package.json" ]; then
              cp -rf "$TMP_DIR"/* .
            else
              SUBDIR=$(find "$TMP_DIR" -mindepth 1 -maxdepth 1 -type d | head -n 1)
              if [ -n "$SUBDIR" ] && ( [ -d "$SUBDIR/src" ] || [ -f "$SUBDIR/package.json" ] ); then
                cp -rf "$SUBDIR"/* .
              else
                cp -rf "$TMP_DIR"/* .
              fi
            fi
            rm -rf "$TMP_DIR"
            git rm -f "$z" 2>/dev/null || rm -f "$z"
          done

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: sync Rahat directory admin hub, animated stadium pitch, and mobile app settings"
            git pull --rebase origin main || true
            git push origin HEAD:main
          else
            echo "No file changes to commit."
          fi
