          if b64_gz_data.strip():
              raw = base64.b64decode(b64_gz_data)
              with tarfile.open(fileobj=io.BytesIO(raw), mode="r:gz") as tf:
                  tf.extractall(".")
              print("Applied Rahat Directory Hub, Top Weather Bar, Launch Splash & Status Bar updates!")

          if os.path.exists("index.tsx"):
              os.makedirs("src/routes", exist_ok=True)
              shutil.move("index.tsx", "src/routes/index.tsx")
              print("Moved root index.tsx -> src/routes/index.tsx")

          # Remove or neutralize old apply-admob-sdk.yml and any old push triggers in other workflows
          old_wf = ".github/workflows/apply-admob-sdk.yml"
          if os.path.exists(old_wf):
              try:
                  os.remove(old_wf)
                  print("Removed old .github/workflows/apply-admob-sdk.yml so it cannot overwrite new routes!")
              except Exception:
                  pass

          for wf_p in glob.glob(".github/workflows/*.yml"):
              if os.path.basename(wf_p) in ("unpack-zips.yml", "update-buses.yml", "update-directory.yml"):
                  continue
              try:
                  with open(wf_p, "r", encoding="utf-8") as f:
                      txt = f.read()
                  new_txt = re.sub(r"on:\s+push:\s+branches:\s+- main\s+workflow_dispatch:", "on:\n  workflow_dispatch:", txt)
                  new_txt = re.sub(r"- name: Unpack any uploaded ZIPs[\s\S]*?(?=- name: Setup Node\.js 20)", "", new_txt)
                  if "b64_data" in new_txt:
                      os.remove(wf_p)
                      print("Removed legacy b64_data workflow:", wf_p)
                  elif new_txt != txt:
                      with open(wf_p, "w", encoding="utf-8") as f:
                          f.write(new_txt)
              except Exception as e:
                  print("Workflow cleanup note:", e)

          try:
              from PIL import Image, ImageDraw
              fg_img = Image.open("mobile/assets/icon-foreground.png").convert("RGBA")
              bbox = fg_img.getbbox()
              stamp_img = fg_img.crop(bbox) if bbox else fg_img
              def make_splash(w, h, dark=False):
                  bg = (17, 24, 39) if dark else (242, 201, 76)
                  canvas = Image.new("RGBA", (w, h), bg + (255,))
                  bsize = max(130, min(260, int(min(w, h) * 0.23)))
                  rad = int(bsize * 0.30)
                  hsize = int(bsize * 1.34)
                  halo = Image.new("RGBA", (w, h), (0, 0, 0, 0))
                  ImageDraw.Draw(halo).ellipse([(w-hsize)//2, (h-hsize)//2, (w+hsize)//2, (h+hsize)//2], fill=(255,255,255,45) if not dark else (242,201,76,40))
                  canvas = Image.alpha_composite(canvas, halo)
                  card = Image.new("RGBA", (w, h), (0, 0, 0, 0))
                  ImageDraw.Draw(card).rounded_rectangle([(w-bsize)//2, (h-bsize)//2, (w+bsize)//2, (h+bsize)//2], radius=rad, fill=(255,255,255,255), outline=(17,24,39,45), width=max(2, bsize//48))
                  canvas = Image.alpha_composite(canvas, card)
                  sw, sh = stamp_img.size
                  sc = min((bsize * 0.76) / sw, (bsize * 0.76) / sh)
                  nw, nh = max(1, int(sw * sc)), max(1, int(sh * sc))
                  rs = stamp_img.resize((nw, nh), Image.Resampling.LANCZOS)
                  canvas.paste(rs, ((w - nw) // 2, (h - nh) // 2), rs)
                  return canvas.convert("RGB")
              for p in sorted(set(["mobile/assets/splash.png", "mobile/assets/splash-dark.png"] + glob.glob("mobile/android/app/src/main/res/drawable*/splash.png") + glob.glob("public/splash/*.png"))):
                  if os.path.exists(p):
                      with Image.open(p) as im:
                          w, h = im.size
                      make_splash(w, h, dark=("night" in p or "dark" in p)).save(p, "PNG", optimize=True)
          except Exception as e:
              print("Splash regen note:", e)
          PYEOF

          UNZIPPED_ANY=0
          while IFS= read -r -d '' Z; do
            LOWER=$(echo "$Z" | tr '[:upper:]' '[:lower:]')
            if [[ "$LOWER" == *"routes"* ]]; then
              mkdir -p src/routes
              unzip -o "$Z" -d src/routes/
              rm -f "$Z"
              UNZIPPED_ANY=1
            elif [[ "$LOWER" == *"mobile"* || "$LOWER" == *"admob"* || "$LOWER" == *"rahatpost"* || "$LOWER" == *"update"* ]]; then
              unzip -o "$Z" -d .
              rm -f "$Z"
              UNZIPPED_ANY=1
            fi
          done < <(find . -maxdepth 3 -type f -iname "*.zip" -not -path "./.git/*" -print0)

          rm -f .github/workflows/apply-admob-sdk.yml

      - name: Commit and push extracted files
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore redesigned Rahat Directory Hub + single-row Top Weather Bar ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git pull --rebase origin main
          git push origin main
