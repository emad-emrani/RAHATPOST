name: Unpack Submitted Zip Updates

on:
  push:
    branches: [ main ]
    paths:
      - '*.zip'
      - 'updates/*.zip'
      - '.github/workflows/unpack-zips.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

