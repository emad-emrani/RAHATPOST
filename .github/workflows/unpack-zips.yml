name: Unpack uploaded ZIPs

# Manual only. Unpacks zip archives already committed in the repo and opens a
# pull request. It does not push to main, and it does not put the live site
# into maintenance mode.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack zip archives onto a pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          ZIPS=(*.zip mobile/*.zip public/*.zip)
          if [ ${#ZIPS[@]} -eq 0 ]; then
            echo "No .zip files found to unpack."
            exit 0
          fi

          for z in "${ZIPS[@]}"; do
            echo "Processing archive: $z"
            TMP_DIR=$(mktemp -d)
            unzip -q -o "$z" -d "$TMP_DIR"
            rm -rf "$TMP_DIR/.github/workflows"

            SUBDIRS=("$TMP_DIR"/*)
            if [ ${#SUBDIRS[@]} -eq 1 ] && [ -d "${SUBDIRS[0]}" ] && { [ -f "${SUBDIRS[0]}/package.json" ] || [ -d "${SUBDIRS[0]}/src" ]; }; then
              echo "Detected a wrapped root folder inside $z — flattening to the repo root."
              cp -rf "${SUBDIRS[0]}"/. .
            else
              TARGET_DIR=$(dirname "$z")
              echo "Extracting $z into $TARGET_DIR."
              cp -rf "$TMP_DIR"/. "$TARGET_DIR"/
            fi

            rm -rf "$TMP_DIR"
            git rm -f "$z" 2>/dev/null || rm -f "$z"
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="chore/unpack-zips-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git add -A
          git reset HEAD .github/workflows/ 2>/dev/null || true
          git checkout -- .github/workflows/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No file changes after unpacking."
            exit 0
          fi
          git commit -m "chore: unpack uploaded zip archive"
          git push origin "HEAD:${BRANCH}"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Unpack uploaded zip archive" \
            --body "Opened by the manual unpack workflow. Review the diff before merging. This workflow does not push to main."
