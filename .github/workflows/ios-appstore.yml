name: Build and Upload iOS to App Store Connect

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  ios-release:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      BUNDLE_ID: com.rahatpost.app
      XCODE_WORKSPACE: mobile/ios/App/App.xcworkspace
      XCODE_SCHEME: App
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install codemagic-cli-tools for automatic Apple Signing & Publishing
        run: |
          python3 -m pip install --user --break-system-packages codemagic-cli-tools || pip3 install --user codemagic-cli-tools
          USER_BASE=$(python3 -m site --user-base)
          echo "${USER_BASE}/bin" >> "$GITHUB_PATH"

      - name: Fix AppDelegate.swift for Xcode 16 & GoogleMobileAds SDK v12+
        run: |
          cat << 'EOF' > mobile/ios/App/App/AppDelegate.swift
          import UIKit
          import Capacitor

          @UIApplicationMain
          class AppDelegate: UIResponder, UIApplicationDelegate {

              var window: UIWindow?

              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  return true
              }

              func applicationWillResignActive(_ application: UIApplication) {}
              func applicationDidEnterBackground(_ application: UIApplication) {}
              func applicationWillEnterForeground(_ application: UIApplication) {}
              func applicationDidBecomeActive(_ application: UIApplication) {}
              func applicationWillTerminate(_ application: UIApplication) {}

              func application(_ app: UIApplication, open url: URL, options: [UIApplication.OpenURLOptionsKey: Any] = [:]) -> Bool {
                  return ApplicationDelegateProxy.shared.application(app, open: url, options: options)
              }

              func application(_ application: UIApplication, continue userActivity: NSUserActivity, restorationHandler: @escaping ([UIUserActivityRestoring]?) -> Void) -> Bool {
                  return ApplicationDelegateProxy.shared.application(application, continue: userActivity, restorationHandler: restorationHandler)
              }

          }
          EOF

      - name: Install Capacitor & CocoaPods dependencies
        run: |
          cd mobile
          npm install
          npx cap sync ios
          cd ios/App
          pod install

      - name: Clean old temporary Distribution certificates & create fresh signing files
        run: |
          keychain initialize
          python3 - << 'PYEOF'
          import json, subprocess
          for ctype in ("DISTRIBUTION", "IOS_DISTRIBUTION"):
              out = subprocess.run(
                  ["app-store-connect", "certificates", "list", "--type", ctype, "--json"],
                  capture_output=True, text=True
              )
              if out.returncode == 0 and out.stdout.strip():
                  try:
                      certs = json.loads(out.stdout)
                      for c in certs:
                          cid = c.get("id")
                          if cid:
                              print(f"Revoking old {ctype} certificate: {cid}")
                              subprocess.run(["app-store-connect", "certificates", "delete", cid], check=False)
                  except Exception as e:
                      print("Note:", e)
          PYEOF
          openssl genrsa -out /tmp/cert_key.pem 2048
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --platform IOS \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key.pem \
            --create
          keychain add-certificates

      - name: Apply provisioning profile & increment build number
        run: |
          xcode-project use-profiles --project mobile/ios/App/App.xcodeproj
          cd mobile/ios/App && agvtool new-version -all "$GITHUB_RUN_NUMBER"

      - name: Build signed IPA for App Store
        run: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

      - name: Upload IPA to App Store Connect (TestFlight)
        run: |
          app-store-connect publish \
            --path "build/ios/ipa/*.ipa"
